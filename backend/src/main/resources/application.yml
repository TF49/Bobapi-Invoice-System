spring:
  application:
    name: invoice-system
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/invoice_system?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 200649

  sql:
    init:
      mode: always
      encoding: UTF-8
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: "BobapiInvoiceSystemSecureKey2024!@#$%^&*()_+-=[]{}|;:,.<>?/~`"
  expiration: 86400000  # 24小时（毫秒）
  remember-me-expiration: 604800000  # 7天（毫秒）

# 文件存储路径
file:
  upload-path: ./uploads

# 服务器配置
server:
  port: 9090
  servlet:
    context-path: /api

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
