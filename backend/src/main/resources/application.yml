spring:
  application:
    name: invoice-system

  jackson:
    deserialization:
      fail-on-unknown-properties: true
  
  # 数据库配置
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:invoice_system}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never
      encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # 版本 18 由既有部署中的充值申请迁移使用，当前源码不再重复携带该脚本。
    # 仅忽略已执行但源码缺失的历史迁移，保留其余迁移的校验。
    validate-on-migrate: true
    ignore-migration-patterns: "*:missing"
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-for-local-development-only}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时（毫秒）
  remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:604800000}  # 7天（毫秒）

# 文件存储路径
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  image:
    max-width: ${INVOICE_IMAGE_MAX_WIDTH:8000}
    max-height: ${INVOICE_IMAGE_MAX_HEIGHT:8000}
    max-pixels: ${INVOICE_IMAGE_MAX_PIXELS:30000000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173,http://your-domain.com,https://your-domain.com}
  invoice:
    batch:
      user-limit: ${INVOICE_BATCH_USER_LIMIT:3}
      user-window-minutes: ${INVOICE_BATCH_USER_WINDOW_MINUTES:1}
      ip-limit: ${INVOICE_BATCH_IP_LIMIT:20}
      ip-window-minutes: ${INVOICE_BATCH_IP_WINDOW_MINUTES:5}
      max-items: ${INVOICE_BATCH_MAX_ITEMS:100}
      max-request-bytes: ${INVOICE_BATCH_MAX_REQUEST_BYTES:524288}

# 服务器配置
server:
  port: 9090
  servlet:
    context-path: /api

# AI 智能识别配置
ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:deepseek}          # 支持: deepseek / openai / gemini / qwen
  api-key: ${AI_API_KEY:}                    # 通过环境变量 AI_API_KEY 注入，切勿硬编码
  api-url: ${AI_API_URL:}                    # 留空时按 provider 使用默认地址
  model: ${AI_MODEL:deepseek-v4-flash}        # 指定模型: deepseek-v4-flash
  timeout-seconds: ${AI_TIMEOUT_SECONDS:20}  # 请求超时时间（秒）

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
