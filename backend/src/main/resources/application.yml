spring:
  application:
    name: invoice-system

  jackson:
    deserialization:
      fail-on-unknown-properties: true
  
  # 数据库配置
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:invoice_system}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never
      encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # 版本 18 由既有部署中的充值申请迁移使用，当前源码不再重复携带该脚本。
    # 仅忽略已执行但源码缺失的历史迁移，保留其余迁移的校验。
    validate-on-migrate: true
    ignore-migration-patterns: "*:missing"
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILE_MAX_SIZE:50MB}
      max-request-size: ${REQUEST_MAX_SIZE:50MB}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志默认关闭：StdOutImpl 会把含金额、公司名称、税号等敏感数据的完整 SQL
    # 打印到标准输出，生产环境存在数据泄露风险。需要排查 SQL 时通过环境变量显式开启：
    #   MYBATIS_SQL_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_SQL_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-for-local-development-only}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时（毫秒）
  remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:604800000}  # 7天（毫秒）

# 文件存储路径
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  image:
    max-width: ${INVOICE_IMAGE_MAX_WIDTH:8000}
    max-height: ${INVOICE_IMAGE_MAX_HEIGHT:8000}
    max-pixels: ${INVOICE_IMAGE_MAX_PIXELS:30000000}

app:
  # 部署在 Nginx 等反向代理后设为 true。开启后仅当直连来源属于 trusted-proxies 时才解析转发头，
  # 并从 X-Forwarded-For 右侧向左跳过可信代理取真实 IP，客户端自行伪造的最左侧条目不会被采用。
  # 未开启时，代理后的所有用户会共用代理 IP，导致限流与验证码 IP 绑定失效。
  client-ip:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    # 可信代理列表（逗号分隔的 IP 或 CIDR），只填直接转发到后端的代理地址，例如 Nginx 容器的固定 IP。
    # 不要填整个私有网段：内网客户端本身在私有网段内，会被当作代理跳过，从而能伪造 X-Forwarded-For。
    # 前面若还有 CDN / 云负载均衡，请把其回源地址追加进来。
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.0/8,::1/128}
  security:
    captcha:
      # 单 IP 10 分钟内滑块失败达到该次数后，暂停获取/提交验证码（0 表示关闭）
      failure-limit: ${CAPTCHA_FAILURE_LIMIT:10}
    register:
      # 注册成功配额，0 表示关闭对应维度
      ip-hourly-limit: ${REGISTER_IP_HOURLY_LIMIT:3}
      ip-daily-limit: ${REGISTER_IP_DAILY_LIMIT:10}
      # 同一 IPv4 /24 或 IPv6 /64 网段每天的注册上限
      subnet-daily-limit: ${REGISTER_SUBNET_DAILY_LIMIT:30}
      # 全站每小时注册上限（熔断，防止大规模分布式注册）
      global-hourly-limit: ${REGISTER_GLOBAL_HOURLY_LIMIT:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173,http://your-domain.com,https://your-domain.com}
  invoice:
    batch:
      user-limit: ${INVOICE_BATCH_USER_LIMIT:3}
      user-window-minutes: ${INVOICE_BATCH_USER_WINDOW_MINUTES:1}
      ip-limit: ${INVOICE_BATCH_IP_LIMIT:20}
      ip-window-minutes: ${INVOICE_BATCH_IP_WINDOW_MINUTES:5}
      max-items: ${INVOICE_BATCH_MAX_ITEMS:100}
      max-request-bytes: ${INVOICE_BATCH_MAX_REQUEST_BYTES:524288}

# 服务器配置
server:
  port: 9090
  servlet:
    context-path: /api

# AI 智能识别配置
ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:deepseek}          # 支持: deepseek / openai / gemini / qwen
  api-key: ${AI_API_KEY:}                    # 通过环境变量 AI_API_KEY 注入，切勿硬编码
  api-url: ${AI_API_URL:}                    # 留空时按 provider 使用默认地址
  model: ${AI_MODEL:deepseek-v4-flash}        # 指定模型；留空时按 provider 使用代码内置默认值
  timeout-seconds: ${AI_TIMEOUT_SECONDS:20}  # 请求超时时间（秒）

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
