spring:
  application:
    name: invoice-system
  
  # 数据库配置
  # 必填环境变量：DB_PASSWORD、JWT_SECRET
  # 系统级已配置：DB_USERNAME=root、DB_NAME=invoice_system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:invoice_system}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never
      encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）
  remember-me-expiration: 604800000  # 7天（毫秒）

# 文件存储路径
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  image:
    max-width: ${INVOICE_IMAGE_MAX_WIDTH:8000}
    max-height: ${INVOICE_IMAGE_MAX_HEIGHT:8000}
    max-pixels: ${INVOICE_IMAGE_MAX_PIXELS:30000000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# 服务器配置
server:
  port: 9090
  servlet:
    context-path: /api

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
