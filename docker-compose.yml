version: '3.8'

# 生产部署请通过 .env 覆盖 DB_PASSWORD / JWT_SECRET，切勿使用下方开发默认值。
services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: invoice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-invoice_system}
      MYSQL_USER: ${DB_USERNAME:-invoice_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root123}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - invoice-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    image: invoice-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-invoice_system}
      DB_USERNAME: ${DB_USERNAME:-invoice_user}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      SPRING_FLYWAY_ENABLED: true
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-for-local-development-only}
      JWT_EXPIRATION: 86400000
      JWT_REMEMBER_ME_EXPIRATION: 604800000
      FILE_UPLOAD_PATH: /app/uploads
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-50MB}
      REQUEST_MAX_SIZE: ${REQUEST_MAX_SIZE:-50MB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}
      # 后端位于前端 Nginx 之后：只信任 Nginx 容器固定 IP 发来的转发头，用于限流与验证码绑定真实 IP。
      # 修改下方 frontend 的 ipv4_address 时必须同步修改这里；前面还有 CDN / 负载均衡时把其回源地址追加进来。
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.238.10}
      REGISTER_IP_HOURLY_LIMIT: ${REGISTER_IP_HOURLY_LIMIT:-3}
      REGISTER_IP_DAILY_LIMIT: ${REGISTER_IP_DAILY_LIMIT:-10}
      REGISTER_SUBNET_DAILY_LIMIT: ${REGISTER_SUBNET_DAILY_LIMIT:-30}
      REGISTER_GLOBAL_HOURLY_LIMIT: ${REGISTER_GLOBAL_HOURLY_LIMIT:-60}
      CAPTCHA_FAILURE_LIMIT: ${CAPTCHA_FAILURE_LIMIT:-10}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
    ports:
      - "9090:9090"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - invoice-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/api/doc.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # 前端服务
  frontend:
    image: invoice-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      invoice-network:
        # 固定 IP，后端 TRUSTED_PROXIES 只信任该地址
        ipv4_address: 172.16.238.10
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mysql-data:
    driver: local
  backend-uploads:
    driver: local

networks:
  invoice-network:
    driver: bridge
    ipam:
      config:
        # 固定子网，供 frontend 使用固定 IP。若与宿主机已有网段冲突，修改此处并同步
        # frontend 的 ipv4_address 与 backend 的 TRUSTED_PROXIES。
        - subnet: 172.16.238.0/24
          # 其他容器的动态 IP 只从后半段分配，避免占用 frontend 的固定 IP
          ip_range: 172.16.238.128/25
